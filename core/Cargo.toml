[package]
name = "pulsedcm-core"
authors = ["Antonin Chafiol <antonin.chafiol@gmail.com"]
version = "0.4.1"
description = "Core models, processes that're common to each commands/processes"
edition = "2024"
[dependencies]
# DICOM related crates
dicom-object = "0.8.1"                                  
dicom-core = "0.8.1"
dicom-dictionary-std = "0.8.0"
dicom-pixeldata = { version = "0.8.1", features=['image']}
serde = { version = "1", features = ["derive"] }
rayon = "1.10.0"
walkdir = "2.5.0"
jp2k = {path = "../commands/view/jp2k", optional = true}
csv = "1.3.1"
image = "0.25.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[features]
jp2k = ["dep:jp2k"]
