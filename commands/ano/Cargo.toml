[package]
name = "pulsedcm-commands-ano"
authors = ["Antonin Chafiol <antonin.chafiol@gmail.com"]
version = "0.4.1"
description = "De-identification of DICOM files"
edition = "2021"

[dependencies]
criterion = { workspace = true }
pulsedcm-core = { path = "../../core" }
phf = { version = "0.13.1",  features = ["macros"] }
dashmap = "6.1.0"
uuid = { version = "1.18.1", features = ["v4"]}
smallvec = "1.15.1"
sha2 = "0.10.9"

[[bench]]
name = "deid"
harness = false
