[package]
name = "jp2k"
version = "0.3.1"
authors = ["Jacob Brown <kardeiz@gmail.com>", "Leo Schwarz <mail@leoschwarz.com>"]
license = "MIT OR Apache-2.0"
edition = "2018"
categories = ["multimedia::images"]
description = "Interface to load JPEG200 images into image"
keywords = ["jpeg2000", "jp2", "jp2k", "openjpeg"]
readme = "README.md"
repository = "https://github.com/kardeiz/jp2k"

[dependencies]
libc = { version = "0.2", optional = true }
rips = { path = "rips", optional = true }

[build-dependencies]
bindgen = { version = "0.69", optional = true }
pkg-config = { version = "0.3.16", optional = true }


[dev-dependencies]
stopwatch = { version = "0.0.7"}
env_logger = { version = "0.7.0"}


[features]
jp2k = ["rips", "rips/jp2k", "libc", "bindgen", "pkg-config"]
docs-rs = []

[package.metadata.docs.rs]
features = ["docs-rs"]
